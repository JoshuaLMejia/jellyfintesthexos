# local dev only. mirrors the truenas mount layout the hook expects.
services:
  jellyfintesthexos:
    build: .
    image: jellyfintesthexos:dev
    container_name: jellyfintesthexos
    ports:
      - "8096:8096"
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - ./data/movies:/movies
      - ./data/shows:/shows
      - ./data/music:/music
    # uncomment to test intel/amd hardware transcoding detection:
    # devices:
    #   - /dev/dri:/dev/dri
